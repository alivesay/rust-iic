# ld65 config for dhgr_term.s
#
# Free-floating module loaded into RAM at $0900 by the boot terminal's
# ESC L command and auto-launched.  Output is a raw .bin (no header).

MEMORY {
    DHGR: start = $0900, size = $1700, fill = no, file = %O;
}

SEGMENTS {
    DHGR: load = DHGR, type = ro, align = $100;
}
