# ld65 config for programs/engine/engine.s
#
# Shared engine binary used by every BASIC-driven game disk. BLOAD'd
# at $6000; BASIC enters via CALL 24576.

MEMORY {
    GAME:  start = $8000, size = $1600, fill = no, file = %O;
    LIBSS: start = $0F80, size = $0080, fill = no, file = "";
}

SEGMENTS {
    GAME: load = GAME,  type = ro, align = $100;
    CODE: load = GAME,  type = ro, align = $100;
    BSS:  load = LIBSS, type = bss;
}
