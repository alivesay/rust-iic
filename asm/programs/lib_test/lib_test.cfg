# ld65 config for programs/lib_test/lib_test.s
#
# Same memory layout as hires_engine: BLOAD'd at $6000 by DOS 3.3.
# Exercises the new lib path (engine_init + tilemap + input_publish
# + map_draw_dirty) as a Phase 1 smoke test. BASIC bootstrap on disk
# lands in Phase 1.5.

MEMORY {
    GAME:  start = $6000, size = $2000, fill = no, file = %O;
    LIBSS: start = $0F80, size = $0080, fill = no, file = "";
}

SEGMENTS {
    GAME: load = GAME,  type = ro, align = $100;
    CODE: load = GAME,  type = ro, align = $100;
    BSS:  load = LIBSS, type = bss;
}
