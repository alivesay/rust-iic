# ld65 config for programs/cart_edit/cart_edit.s
#
# Standalone cart editor binary (sprites + tilemap + flags). Self-contained:
# includes engine_init, all libs, and the editor main loop. BLOAD'd at
# $8000, entered via CALL 32768.

MEMORY {
    GAME:  start = $7800, size = $1A00, fill = no, file = %O;
    LIBSS: start = $0F80, size = $00C0, fill = no, file = "";
}

SEGMENTS {
    GAME: load = GAME,  type = ro, align = $100;
    CODE: load = GAME,  type = ro, align = $100;
    BSS:  load = LIBSS, type = bss;
}
