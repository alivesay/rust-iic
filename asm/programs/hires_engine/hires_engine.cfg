# ld65 config for asm/programs/hires_engine/engine.s
#
# Loads at $6000.  Plenty of headroom:
#   $0000-$00FF  zero page
#   $0100-$01FF  stack
#   $0800-$1FFF  free (DOS 3.3 BLOAD scratch / used briefly during BRUN)
#   $2000-$3FFF  HGR1 (engine clears + draws here)
#   $4000-$5FFF  free (HGR2 if we want page flipping)
#   $6000-$95FF  engine code, state, tables    <-- us
#   $9600+       DOS 3.3
#
# Bumping load addr or growing past $9600 means lowering DOS HIMEM first.
# 8 KB region keeps the engine + tables comfortable.

MEMORY {
    GAME: start = $6000, size = $2000, fill = no, file = %O;
}

SEGMENTS {
    GAME: load = GAME, type = ro, align = $100;
}
